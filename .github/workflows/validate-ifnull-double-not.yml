name: Validate IFNULL scalar-subquery fix

"on":
  push:
    branches:
      - codex/validate-ifnull-double-not-type

permissions:
  contents: read

concurrency:
  group: validate-ifnull-double-not-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: https://github.com/CQU-WCJ/seekdb.git
  SOURCE_REF: codex/fix-ifnull-double-not-type
  # Replace with the reviewed 40-character commit before publishing this workflow.
  EXPECTED_SOURCE_SHA: "eb975f9b8c2e7c327e962f9359dec6445c2b27b5"
  # These names must match the regression committed on SOURCE_REF.
  REGRESSION_SUITE: subquery
  REGRESSION_CASE: ifnull_double_not_type
  CARGO_BUILD_JOBS: "2"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  release-and-mysqltest:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - name: Check hosted runner and free disposable tools
        env:
          TASK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$TASK_RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          mkdir -p logs
          df -h | tee logs/disk-before.log
          # Only known preinstalled tools on this disposable GitHub-hosted VM.
          # Never run this cleanup on the user's computer or a self-hosted runner.
          sudo rm -rf -- /opt/ghc /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h | tee logs/disk-after.log
          free -h | tee logs/memory.log
          available_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          if (( available_kib < 25 * 1024 * 1024 )); then
            echo 'Less than 25 GiB free after cleanup; refusing a cold full build.' >&2
            exit 1
          fi

      - name: Install Linux host prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git wget curl ca-certificates rpm rpm2cpio cpio make build-essential \
            binutils m4 file python3 libaio1t64 pkg-config

      - name: Fetch the exact public source and check regression files
        id: source
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Set EXPECTED_SOURCE_SHA to the reviewed fix commit before running.' >&2
            exit 1
          fi
          git init source
          git -C source remote add origin "$SOURCE_REPOSITORY"
          git -C source -c credential.helper= -c credential.interactive=never \
            fetch --no-tags --depth=1 origin "$SOURCE_REF"
          git -C source checkout --detach FETCH_HEAD
          actual_sha=$(git -C source rev-parse HEAD)
          test "$actual_sha" = "$EXPECTED_SOURCE_SHA"
          printf '%s\n' "$actual_sha" | tee logs/source-sha.txt
          test -f "source/tools/deploy/mysql_test/test_suite/$REGRESSION_SUITE/t/$REGRESSION_CASE.test"
          test -f "source/tools/deploy/mysql_test/test_suite/$REGRESSION_SUITE/r/mysql/$REGRESSION_CASE.result"
          test -f source/tools/deploy/mysql_test/test_suite/datatype/t/bool.test
          git -C source diff --check

      - name: Install the repository-pinned native Rust toolchain
        working-directory: source
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error \
              --location https://sh.rustup.rs --output "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal \
              --default-toolchain none --no-modify-path
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rust_version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust/rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$rust_version" --profile minimal
          rustup run "$rust_version" cargo --version
          rustup run "$rust_version" rustc --version
          # A native server build does not need the Android/iOS/Windows cross targets.
          echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Prepare the official dependency SDK
        working-directory: source
        run: |
          set -euo pipefail
          python3 build.py init 2>&1 | tee ../logs/dependency-init.log
          # Unpacked SDK files remain; compressed installers are unnecessary here.
          if [[ -d deps/3rd/pkg ]]; then
            find deps/3rd/pkg -maxdepth 1 -type f -name '*.rpm' -delete
          fi
          du -sh deps/3rd | tee ../logs/sdk-size.log
          for tool in deps/3rd/u01/obclient/bin/obclient deps/3rd/u01/obclient/bin/mysqltest; do
            test -x "$tool"
            linkage=$(ldd "$tool" 2>&1) || true
            printf '%s\n%s\n' "$tool" "$linkage" | tee -a ../logs/client-linkage.log
            "$tool" --version | tee -a ../logs/client-linkage.log
          done
          if grep -q 'not found' ../logs/client-linkage.log; then
            echo 'A packaged SQL client has an unresolved runtime library; see client-linkage.log.' >&2
            exit 1
          fi
          df -h | tee ../logs/disk-after-sdk.log

      - name: Build the production binary with Release defaults
        id: build
        working-directory: source
        run: |
          set -euo pipefail
          # build.py/.bazelrc use the repository's default optimized (-O2) build.
          # Disable the separate action cache to avoid duplicate local build storage.
          # This is a native Linux build; do not discover the removed Android SDK
          # through the hosted runner's inherited ANDROID_NDK_HOME.
          python3 build.py build -j2 --local_resources=memory=12000 \
            --host_jvm_args=-Xmx2048m --disk_cache= --repo_env=ANDROID_NDK_HOME= \
            //src/observer:seekdb 2>&1 | tee ../logs/release-build.log
          test -x build/bin/src/observer/seekdb
          test -x deps/3rd/u01/obclient/bin/obclient
          test -x deps/3rd/u01/obclient/bin/mysqltest
          df -h | tee ../logs/disk-after-build.log

      - name: Run the focused regression and datatype.bool with mysqltest
        id: mysqltest
        working-directory: source
        run: |
          set -euo pipefail
          repo="$PWD"
          client="$repo/deps/3rd/u01/obclient/bin"
          base_dir="$RUNNER_TEMP/seekdb-1477"
          log_root="$GITHUB_WORKSPACE/logs/mysqltest"
          mkdir -p "$log_root"
          export PATH="$client:$PATH"
          python3 .github/script/seekdb/sdb.py start \
            --binary "$repo/build/bin/src/observer/seekdb" \
            --base-dir "$base_dir" --port 2881
          python3 .github/script/seekdb/sdb.py wait-ready \
            --client "$client/obclient" --base-dir "$base_dir" \
            --host 127.0.0.1 --port 2881 --user root --timeout 600
          "$client/obclient" -h127.0.0.1 -P2881 -uroot -A \
            -e 'CREATE DATABASE IF NOT EXISTS test; SELECT VERSION();' \
            | tee "$log_root/server-version.log"
          export OBMYSQL_PORT=2881 OBMYSQL_MS0=127.0.0.1 OBMYSQL_MS0_DEV=127.0.0.1
          export OBMYSQL_USR=root OBMYSQL_PWD='' OBSERVER_DIR="$base_dir"
          export IS_BUSINESS=0 TENANT=mysql
          cd tools/deploy
          run_case() {
            local suite="$1" name="$2"
            local case_root="$repo/tools/deploy/mysql_test/test_suite/$suite"
            local case_logs="$log_root/$suite.$name"
            mkdir -p "$case_logs/tmp"
            if ! "$client/mysqltest" --host=127.0.0.1 --port=2881 --user=root \
              --database=test --tmpdir="$case_logs/tmp" --logdir="$case_logs" \
              --silent --test-file="$case_root/t/$name.test" \
              --result-file="$case_root/r/mysql/$name.result" \
              --timer-file="$case_logs/timer" --tail-lines=20 \
              2>&1 | tee "$case_logs/runner.log"; then
              return 1
            fi
            printf 'PASS %s.%s\n' "$suite" "$name" | tee -a "$log_root/passed.txt"
          }
          case_status=0
          run_case "$REGRESSION_SUITE" "$REGRESSION_CASE" || case_status=1
          run_case datatype bool || case_status=1
          exit "$case_status"

      - name: Stop the disposable database and show diagnostics
        if: always()
        run: |
          set -uo pipefail
          if [[ -f source/.github/script/seekdb/sdb.py && -d "$RUNNER_TEMP/seekdb-1477" ]]; then
            python3 source/.github/script/seekdb/sdb.py stop \
              --base-dir "$RUNNER_TEMP/seekdb-1477" || true
          fi
          if [[ -d logs/mysqltest ]]; then
            find logs/mysqltest -type f -name '*.reject' -print -exec tail -n 80 {} \;
          fi
          if [[ -d "$RUNNER_TEMP/seekdb-1477/log" ]]; then
            find "$RUNNER_TEMP/seekdb-1477/log" -maxdepth 1 -type f \
              -name '*WARN*' -print -exec tail -n 50 {} \;
          fi

      - name: Write validation summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          MYSQLTEST_OUTCOME: ${{ steps.mysqltest.outcome }}
        run: |
          set -uo pipefail
          {
            echo '## SeekDB IFNULL validation'
            echo
            echo "- Source ref: \`$SOURCE_REF\`"
            echo "- Expected commit: \`$EXPECTED_SOURCE_SHA\`"
            echo "- Release build: **$BUILD_OUTCOME**"
            echo "- Focused mysqltest and datatype.bool: **$MYSQLTEST_OUTCOME**"
            echo
            if [[ -f logs/mysqltest/passed.txt ]]; then
              echo '```text'
              cat logs/mysqltest/passed.txt
              echo '```'
            fi
            echo '### Final disk and memory availability'
            echo '```text'
            df -h "$GITHUB_WORKSPACE"
            free -h
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BUILD_OUTCOME" != success && -f logs/release-build.log ]]; then
            echo 'Last 120 build-log lines:'
            tail -n 120 logs/release-build.log
          fi
